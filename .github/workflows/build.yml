
name: Build CS16 Training Panel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile EXE
        shell: cmd
        run: |
          cl /EHsc /O2 main.cpp /link user32.lib gdi32.lib comctl32.lib /OUT:CS16_Training_Panel.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Training-Panel-Windows11
          path: CS16_Training_Panel.exe
